jtex: v1
kind: typst
title: Letterloom Typst Template
description: A letter template
template: template.typ
files:
  - letterloom/lib.typ
  - letterloom/validate-inputs.typ
  - letterloom/construct-outputs.typ
  - template.typ
authors:
  - name: Stéfan van der Walt
    github: stefanv
    affiliations:
      - Scientific Python
      - BIDS, UC Berkeley
version: 0.1.0
license: MIT-0
tags:
  - letter
thumbnail: https://raw.githubusercontent.com/stefanv/myst-typst-letterloom/refs/heads/example/thumbnail.png
github: https://github.com/myst-templates/typst-letterbloom
doc:
  - id: title
    required: true
    description: Letter title
  - id: date
    description: Letter date; leave blank for today's date
options:
- id: from-name
  type: string
  description: Sender's name
  required: true
- id: from-address
  type: string
  description: Sender's address
- id: to-name
  type: string
  description: Recipient's name
- id: to-address
  type: string
  description: Recipient's address
- id: letterhead-image
  type: file
  description: Path to an image file placed at the top of the first page, flush with the page edges
- id: letterhead-width
  type: string
  description: 'Width of the letterhead image, as a Typst length or percentage (e.g., "60%" or "12cm"); default fills the page width'
- id: letterhead-height
  type: string
  description: 'Height of the letterhead image, as a Typst length (e.g., "3cm"); default scales with the width'
- id: letterhead-inset
  type: string
  description: 'Space between the letterhead image and the page edges, as a Typst length or dictionary (e.g., "10mm" or "(x: 20mm, top: 10mm)")'
- id: letterhead-alignment
  type: choice
  choices: [left, center, right]
  description: Horizontal alignment of the letterhead image; ignored when letterhead-sender-position is set
- id: letterhead-sender-position
  type: choice
  choices: [left, center, right]
  description: Put the sender's address in the letterhead, left of, below, or right of the image
- id: letterhead-sender-valign
  type: choice
  choices: [top, horizon, bottom]
  description: Vertical alignment of the sender's address next to the letterhead image (sender position left or right)
- id: letterhead-bottom-gap
  type: string
  description: 'Space below the letterhead, as a Typst length (e.g., "1em"); used when the sender position is center'
- id: banner-image
  type: file
  description: "Deprecated: use letterhead-image. Path to an image file placed inside the top page margin"
- id: salutation
  type: string
  description: Opening greeting
- id: closing
  type: string
  description: Closing phrase
- id: signature-name
  type: string
  description: Name of the signatory (appears in signature block)
- id: signature-title
  type: string
  description: Signatory's official title
- id: signature-affiliation
  type: string
  description: Affiliation of the signatory (e.g., organization or title)
- id: signature-image
  type: file
  description: Path to an image file of the signatory’s handwritten signature
- id: signature-image-width
  type: string
  description: Width of the signature image
